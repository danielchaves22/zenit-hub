services:
  postgres-test:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5440:5432"
    environment:
      POSTGRES_USER: hub_test
      POSTGRES_PASSWORD: hub_test_local
      POSTGRES_DB: zenit_hub_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub_test -d zenit_hub_test"]
      interval: 2s
      timeout: 3s
      retries: 20
